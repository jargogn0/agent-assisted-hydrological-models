data:
  root: 1_LamaH-CE_daily_hourly
  basin_set: A
  time_step: daily
  max_catchments: 150
  random_subset:
    target_n: 150
    seed: 42
  min_valid_days: 3650
  start_year: 2000
  end_year: 2017
  include_impacted: true
  low_impact_only: false
target:
  variable: q_mm_day
  transform: log1p
splits:
  temporal:
    train_end_year: 2009
    val_start_year: 2010
    val_end_year: 2013
    test_start_year: 2014
    test_end_year: 2017
  basin_holdout:
    enabled: true
    train_basins: 100
    test_basins: 50
    seed: 42
features:
  dynamic:
  - prec
  - 2m_temp_mean
  - 2m_temp_max
  - 2m_temp_min
  - swe
  - total_et
  - volsw_123
  - volsw_4
  - surf_net_solar_rad_mean
  - surf_net_therm_rad_mean
  - surf_press
  rolling_windows:
  - 1
  - 3
  - 7
  - 14
  - 30
  - 60
  - 90
  - 180
  static_families:
  - climate
  - topography
  - landcover
  - soil
  - geology
  - human
  - network
models:
  fit_splits:
  - train
  sample_per_basin_train: 400
  sample_seed: 42
  final_n_jobs: 4
  random_forest:
    enabled: true
    n_estimators: 250
    max_depth: 18
    min_samples_leaf: 4
    max_samples: 0.75
    max_features: 0.7
    max_dynamic_window: 90
    peak_flow_quantile: 0.9
