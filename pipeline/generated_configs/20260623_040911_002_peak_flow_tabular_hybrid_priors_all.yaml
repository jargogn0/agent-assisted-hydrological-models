    n_jobs: 4
    random_state: 42
  xgboost:
    enabled: true
    n_estimators: 300
    max_depth: 7
    learning_rate: 0.025
    subsample: 0.85
    colsample_bytree: 0.85
    reg_lambda: 4.0
    objective: reg:squarederror
    n_jobs: 4
    random_state: 42
evaluation:
  high_flow_quantile: 0.95
  low_flow_quantile: 0.05
  signature_min_years: 5
  prediction_splits:
  - val
artifacts:
  save_models: false
  reuse_cached_frame: true
sequence_models:
  enabled: true
  sequence_length: 365
  batch_size: 256
  early_stopping_patience: 8
  learning_rate: 0.0003
  hidden_size: 192
  num_layers: 1
  attention_heads: 4
  dropout: 0.35
  random_seed: 42
  loss: nse
  grad_clip: 1.0
  cosine_schedule: true
  device: auto
  torch_threads: 1
  sample_limit_train: 200000
  sample_limit_eval: 150000
  epochs: 12
  epochs_by_model:
    xlstm: 12
    transformer: 12
