project:
  name: paper4_lamah_ce
  run_name: hess_300train_150spatial
  output_dir: paper4_pipeline/outputs/hess_300train_150spatial

data:
  root: 1_LamaH-CE_daily_hourly
  basin_set: A
  time_step: daily
  # Select 450 eligible catchments, then hold out one stratified third.
  # Effective modelling design: about 300 train/val/temporal-test basins
  # plus about 150 fully unseen spatial-test basins.
  max_catchments: null
  stratified_subset:
    target_n: 450
    seed: 42
    stratify_by: [snow_class, aridity_class, geology_class]
  min_valid_days: 3650
  start_year: 2000
  end_year: 2017
  include_impacted: true
  low_impact_only: false

target:
  variable: q_mm_day
  transform: log1p

splits:
  temporal:
    train_end_year: 2009
    val_start_year: 2010
    val_end_year: 2013
    test_start_year: 2014
    test_end_year: 2017
  spatial:
    enabled: true
    n_folds: 3
    test_fold: 1
    fold_strategy: stratified_hydro
    fold_seed: 42
    evaluation_period: test

features:
  dynamic:
    - prec
    - 2m_temp_mean
    - 2m_temp_max
    - 2m_temp_min
    - swe
    - total_et
    - volsw_123
    - volsw_4
    - surf_net_solar_rad_mean
    - surf_net_therm_rad_mean
    - surf_press
  rolling_windows: [3, 7, 14, 30, 90, 180, 365]
  static_families:
    - climate
    - topography
    - landcover
    - soil
    - geology
    - human
    - network

models:
  # Hyperparameters are locked from the promoted validation-only search.
  # This avoids expensive retuning and keeps spatial/test splits untouched.
  fit_splits: [train]
  sample_per_basin_train: 1800
  sample_limit_train: null
  sample_seed: 42
  final_n_jobs: 4
  tuning:
    enabled: false
    scoring_split: val
    locked_source: hess_final_temporal selected_hyperparameters.json
  random_forest:
    enabled: true
    n_estimators: 700
    max_depth: 28
    min_samples_leaf: 2
    max_samples: 0.75
    n_jobs: 4
    random_state: 42
  xgboost:
    enabled: true
    n_estimators: 900
    max_depth: 6
    learning_rate: 0.030
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 6.0
    objective: reg:squarederror
    n_jobs: 4
    random_state: 42

sequence_models:
  enabled: true
  sequence_length: 365
  sample_limit_train: 500000
  sample_limit_eval: null
  batch_size: 256
  epochs: 30
  epochs_by_model:
    xlstm: 30
    transformer: 30
  early_stopping_patience: 10
  learning_rate: 0.0005
  hidden_size: 192
  num_layers: 1
  attention_heads: 4
  dropout: 0.4
  random_seed: 42
  device: auto
  torch_threads: 1
  loss: nse
  grad_clip: 1.0
  cosine_schedule: true

evaluation:
  high_flow_quantile: 0.95
  low_flow_quantile: 0.05
  signature_min_years: 5
  prediction_splits: [val, test, spatial_test]

artifacts:
  save_models: false
