project:
  name: paper4_lamah_ce
  run_name: hess_100train_50test_push_trainval
  output_dir: paper4_pipeline/outputs/hess_100train_50test_push_trainval

data:
  root: 1_LamaH-CE_daily_hourly
  basin_set: A
  time_step: daily
  max_catchments: 150
  random_subset:
    target_n: 150
    seed: 42
  min_valid_days: 3650
  start_year: 2000
  end_year: 2017
  include_impacted: true
  low_impact_only: false

target:
  variable: q_mm_day
  transform: log1p

splits:
  temporal:
    train_end_year: 2009
    val_start_year: 2010
    val_end_year: 2013
    test_start_year: 2014
    test_end_year: 2017
  basin_holdout:
    enabled: true
    train_basins: 100
    test_basins: 50
    seed: 42

features:
  dynamic:
    - prec
    - 2m_temp_mean
    - 2m_temp_max
    - 2m_temp_min
    - swe
    - total_et
    - volsw_123
    - volsw_4
    - surf_net_solar_rad_mean
    - surf_net_therm_rad_mean
    - surf_press
  rolling_windows: [1, 3, 7, 14, 30, 60, 90, 180, 365]
  static_families:
    - climate
    - topography
    - landcover
    - soil
    - geology
    - human
    - network

models:
  fit_splits: [train, val]
  sample_per_basin_train: null
  sample_limit_train: null
  sample_seed: 42
  final_n_jobs: 4
  tuning:
    enabled: false
    locked_source: hess_100train_50test_push validation-only XGBoost selection
  random_forest:
    enabled: false
    n_estimators: 500
    max_depth: 22
    min_samples_leaf: 3
    max_samples: 0.75
    max_features: 0.7
    n_jobs: 4
    random_state: 42
  xgboost:
    enabled: true
    n_estimators: 1300
    max_depth: 8
    learning_rate: 0.025
    subsample: 0.9
    colsample_bytree: 0.8
    reg_lambda: 6.0
    objective: reg:squarederror
    n_jobs: 4
    random_state: 42

sequence_models:
  enabled: false

evaluation:
  high_flow_quantile: 0.95
  low_flow_quantile: 0.05
  signature_min_years: 5
  prediction_splits: [test, spatial_test]

artifacts:
  save_models: false
  reuse_cached_frame: true
